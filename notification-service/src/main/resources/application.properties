spring.application.name=notification-service
server.port=8083

logging.level.com.bankapp=DEBUG

# Same shared dev secret as every other service (see backend/identity-service
# application.properties) - all services must agree on it to interoperate.
jwt.secret=Y2hhbmdlVGhpc0luUHJvZHVjdGlvbkJhbmtBcHBTZWNyZXRLZXkyMDI0

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.data.mongodb.uri=mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/notifications

# Used only by MessageSeeder at startup to resolve the seeded demo users' ids.
identity.service.url=${IDENTITY_SERVICE_URL:http://localhost:8081}

management.endpoints.web.exposure.include=health
management.endpoint.health.enabled=true
