spring.application.name=identity-service

spring.datasource.url=jdbc:h2:mem:identitydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin123

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.h2.console.path=/h2-console
spring.h2.console.enabled=true

logging.level.com.bankapp=DEBUG

spring.jpa.show-sql=true
server.port=8081
jwt.secret=Y2hhbmdlVGhpc0luUHJvZHVjdGlvbkJhbmtBcHBTZWNyZXRLZXkyMDI0
jwt.expiration=600000

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# KYC document/selfie storage. Locally this points at MinIO (S3-compatible, path-style addressing
# required); in prod (see application-prod.properties) the same S3Client/S3Presigner code points
# at real AWS S3 with no endpoint override and picks up credentials from the instance's IAM role
# instead of a static access/secret key - same code, different config, same as every other
# "local mock vs real backing service" pattern in this app (Redis, mail/OTP).
kyc.storage.endpoint=${KYC_STORAGE_ENDPOINT:http://localhost:9000}
kyc.storage.region=${KYC_STORAGE_REGION:us-east-1}
kyc.storage.bucket=${KYC_STORAGE_BUCKET:kyc-documents}
kyc.storage.access-key=${KYC_STORAGE_ACCESS_KEY:minioadmin}
kyc.storage.secret-key=${KYC_STORAGE_SECRET_KEY:minioadmin}
kyc.storage.path-style-access=${KYC_STORAGE_PATH_STYLE:true}
kyc.storage.allowed-origin=${KYC_STORAGE_ALLOWED_ORIGIN:http://localhost:4200}
