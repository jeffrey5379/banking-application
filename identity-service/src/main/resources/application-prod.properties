spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'update' creates tables on first start; switch to 'validate' after schema stabilises
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.enabled=true
management.endpoint.health.show-details=never

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

# No endpoint override -> real AWS S3. No static access/secret key -> falls back to the default
# AWS credentials chain (the task's IAM role), not a hardcoded credential.
kyc.storage.endpoint=${KYC_STORAGE_ENDPOINT:}
kyc.storage.region=${KYC_STORAGE_REGION:eu-west-1}
kyc.storage.bucket=${KYC_STORAGE_BUCKET}
kyc.storage.access-key=${KYC_STORAGE_ACCESS_KEY:}
kyc.storage.secret-key=${KYC_STORAGE_SECRET_KEY:}
kyc.storage.path-style-access=${KYC_STORAGE_PATH_STYLE:false}
kyc.storage.allowed-origin=${KYC_STORAGE_ALLOWED_ORIGIN}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Must be a sender verified (or a domain authenticated) in the SMTP relay's account -
# see EmailOtpClient.
mail.from=${MAIL_FROM}

logging.level.com.bankapp=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

server.port=8081
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
