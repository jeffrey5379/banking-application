# Backend stack for running Playwright UI tests against the real app (real
# login/OTP flow, real transfers, real seeded alice/bob/carol data - see
# README "Running Locally" for the equivalent manual, non-Docker steps).
#
# Usage:
#   docker compose -f docker-compose.e2e.yml up --build -d
#   docker compose -f docker-compose.e2e.yml down -v
#
# Distinct project name (see docker-compose.yml's "bankapp-dev") so this stack can run
# alongside the day-to-day dev one without container-name collisions.
name: bankapp-e2e

services:
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass d94064dfca2847fdde6b3bd5c81e7873 --loglevel verbose
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "d94064dfca2847fdde6b3bd5c81e7873", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:4200
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  wiremock:
    build:
      context: core-banking/wiremock
    ports:
      - "8089:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/__admin/mappings"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    # Root credentials must match notification-service's dev-default
    # spring.data.mongodb.uri (application.properties) - see README.
    environment:
      MONGO_INITDB_ROOT_USERNAME: bankapp
      MONGO_INITDB_ROOT_PASSWORD: 0ca39c46e075fcc9b4b5446eeab90e9f
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet",
             "-u", "bankapp", "-p", "0ca39c46e075fcc9b4b5446eeab90e9f", "--authenticationDatabase", "admin",
             "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity-service:
    build:
      context: identity-service
    ports:
      - "8081:8081"
    environment:
      REDIS_HOST: redis
      KYC_STORAGE_ENDPOINT: http://minio:9000
      # See docker-compose.yml's identical setting - the browser needs a host it can resolve for
      # presigned upload URLs, unlike KYC_STORAGE_ENDPOINT (this container's own S3Client calls).
      KYC_STORAGE_PRESIGN_ENDPOINT: http://localhost:9000
      KYC_STORAGE_ALLOWED_ORIGIN: http://localhost:4200
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 45s

  core-banking:
    build:
      context: core-banking
    ports:
      - "8082:8082"
    environment:
      REDIS_HOST: redis
      IDENTITY_SERVICE_URL: http://identity-service:8081
      KYC_SERVICE_URL: http://identity-service:8081
      DEBIT_ELIGIBILITY_URL: http://wiremock:8080
    depends_on:
      redis:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 45s

  notification-service:
    build:
      context: notification-service
    ports:
      - "8083:8083"
    environment:
      REDIS_HOST: redis
      MONGO_HOST: mongo
      IDENTITY_SERVICE_URL: http://identity-service:8081
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 45s

  gateway-service:
    build:
      context: gateway-service
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      IDENTITY_SERVICE_URL: http://identity-service:8081
      CORE_BANKING_SERVICE_URL: http://core-banking:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
      FRONTEND_ORIGIN: http://localhost:4200
      RATE_GENERAL_REPLENISH: "50"
      RATE_GENERAL_BURST: "200"
    depends_on:
      redis:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      core-banking:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
